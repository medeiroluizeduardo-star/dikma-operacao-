<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: app shell — dark graphite rail on desktop, bottom tab bar on phones; content is a scanning surface of filters → summary → detail. */
:root{
  --bg:#EEEFF4; --surface:#FFFFFF; --surface-2:#F5F5F9; --line:#D9DAE4; --line-2:#E7E8EF;
  --ink:#16172E; --ink-2:#4A4B66; --ink-3:#787A93;
  --rail:#1C1B4A; --rail-2:#2A2963; --rail-ink:#CFCFE6; --rail-ink-2:#8E8FB8;
  --navy:#272662; --accent:#F05A26; --accent-ink:#FFFFFF; --focus:#3D3AB5;
  --st-prog:#5F6385; --st-real:#1E8A4C; --st-nreal:#D23B3B; --st-extra:#7A4FD6; --st-atr:#B98200;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#9AA1AB;
  --shadow:0 1px 2px rgba(16,22,30,.06),0 4px 16px rgba(16,22,30,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F1C; --surface:#171829; --surface-2:#1D1E33; --line:#2C2D47; --line-2:#24253B;
  --ink:#E8E8F2; --ink-2:#AAABC4; --ink-3:#7A7B97;
  --rail:#0B0B1C; --rail-2:#1A1A3A; --rail-ink:#CFCFE6; --rail-ink-2:#7E7FA6;
  --accent:#F26A3A; --focus:#8C8AF0;
  --st-prog:#9093B2; --st-real:#3CB872; --st-nreal:#EE6262; --st-extra:#A486EE; --st-atr:#E3B23C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F1C; --surface:#171829; --surface-2:#1D1E33; --line:#2C2D47; --line-2:#24253B;
  --ink:#E8E8F2; --ink-2:#AAABC4; --ink-3:#7A7B97;
  --rail:#0B0B1C; --rail-2:#1A1A3A; --rail-ink:#CFCFE6; --rail-ink-2:#7E7FA6;
  --accent:#F26A3A; --focus:#8C8AF0;
  --st-prog:#9093B2; --st-real:#3CB872; --st-nreal:#EE6262; --st-extra:#A486EE; --st-atr:#E3B23C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
h1,h2,h3{margin:0;text-wrap:balance}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:34px;height:34px;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.brand b{display:block;font-family:var(--f-display);font-size:19px;letter-spacing:.02em;color:#fff;line-height:1.05}
.brand small{color:var(--rail-ink-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink-2);padding:12px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--rail-ink);padding:9px 10px;border-radius:6px;text-align:left;font-size:13.5px;position:relative}
.nav button:hover{background:var(--rail-2)}
.nav button[aria-current="page"]{background:var(--rail-2);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.nav .badge{margin-left:auto;background:var(--st-atr);color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:0 7px;line-height:18px}
.nav svg,.tabbar svg{width:18px;height:18px;flex:none}
.who{margin-top:auto;border-top:1px solid var(--rail-2);padding:14px 6px 0;display:flex;flex-direction:column;gap:8px}
.who label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink-2)}
.who select{background:var(--rail-2);border:1px solid #2B323C;border-radius:6px;padding:8px;color:#fff;width:100%}
.who .role{font-size:12px;color:var(--rail-ink-2)}

/* main */
main{min-width:0;padding-block:0 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.top h1{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1;margin-right:auto}
.top h1 small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.02em;margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{display:flex;flex-direction:column;gap:2px}
.sel span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
select.in,input.in{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
input.in{min-width:180px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--st-nreal)}
.btn svg{width:16px;height:16px}
.wrap{padding:20px 28px;display:flex;flex-direction:column;gap:20px}
.demo{margin:14px 28px 0;display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;padding:10px 14px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.demo b{color:var(--ink)}
.demo .btn{padding:4px 10px;font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;padding:14px 16px 0}
.card>header h2{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.card>header p{margin:0;color:var(--ink-3);font-size:12.5px}
.card>header .r{margin-left:auto;min-width:0;max-width:100%}
.card>header .r select{max-width:100%}
td.mono{white-space:nowrap}
.card .body{padding:14px 16px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.muted{color:var(--ink-3)}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* KPI */
.kpis{display:grid;grid-template-columns:1.4fr repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi.hero .v{font-size:52px}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.meter{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--st-real);border-radius:3px}

/* stacked bars */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.barrow .n{font-weight:600;font-size:13px}
.barrow .n small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px}
.barrow .p{font-family:var(--f-display);font-size:20px;font-weight:700;text-align:right}
.stack{display:flex;gap:2px;height:16px;border-radius:4px;overflow:hidden;background:var(--line-2)}
.stack i{display:block;height:100%;min-width:0}
.barrow:hover .n{text-decoration:underline}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:170px;margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:0}
.col{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;position:relative}
.col i{display:block;width:100%;border-radius:0}
.col i:first-child{border-radius:4px 4px 0 0}
.colx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:6px;text-align:center;font-size:11.5px;color:var(--ink-3)}
.colx b{display:block;color:var(--ink);font-weight:600;font-size:12px}
.colx .today b{color:var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:3px;display:inline-block;padding:0 5px}
.col .tot{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-2)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr.grp td{background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;padding:8px 10px;color:var(--ink)}
tr.grp td small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;color:var(--ink-3);margin-left:8px}
td.c,th.c{text-align:center}
td.r,th.r{text-align:right}
th.today{background:color-mix(in srgb,var(--accent) 28%,var(--surface-2));color:var(--ink)}
td.today{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.loc{color:var(--ink-3);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink-2);white-space:nowrap}

/* day chips */
.chip{width:30px;height:30px;border-radius:6px;border:1.5px solid transparent;display:inline-grid;place-items:center;font-size:14px;font-weight:700;background:none;padding:0;line-height:1}
.chip.P{border-color:var(--st-prog);color:var(--st-prog)}
.chip.R{background:var(--st-real);color:#fff}
.chip.N{background:var(--st-nreal);color:#fff}
.chip.E{background:var(--st-extra);color:#fff}
.chip.A{border-color:var(--st-atr);color:var(--st-atr);background:color-mix(in srgb,var(--st-atr) 12%,transparent)}
.chip.X{color:var(--line);font-size:18px}
.chip.X:hover{color:var(--ink-3);border-color:var(--line)}
.chip:hover{filter:brightness(1.08)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--st-real) 14%,transparent);color:var(--st-real)}
.pill.bad{background:color-mix(in srgb,var(--st-nreal) 14%,transparent);color:var(--st-nreal)}
.pill.warn{background:color-mix(in srgb,var(--st-atr) 14%,transparent);color:var(--st-atr)}
.pill.neu{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.exc{background:color-mix(in srgb,var(--st-extra) 14%,transparent);color:var(--st-extra);border:1px solid color-mix(in srgb,var(--st-extra) 35%,transparent)}
.nowrap{flex-wrap:nowrap}
/* Impressão do Efetivo: lista com busca + documento */
.imp-grid{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:16px;align-items:start}
.imp-lista{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 120px);overflow:hidden;margin:0}
.imp-busca{display:flex;flex-direction:column;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.imp-busca .sel{margin:0}
.srch{position:relative;display:block}
.srch svg{position:absolute;left:11px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.srch .in{width:100%;padding-left:36px}
.imp-chips{gap:6px}
.imp-scroll{flex:1;min-height:0;overflow-y:auto;padding:6px}
.imp-it{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer}
.imp-it[hidden]{display:none}
.imp-it b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-it small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-it:hover{background:var(--surface-2)}
.imp-it[aria-current="true"]{background:color-mix(in srgb,var(--accent) 13%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.imp-it:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.imp-doc{min-width:0;display:flex;flex-direction:column;gap:12px}
.imp-hd{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 16px;margin:0}
.imp-hd h2{margin:0 0 2px}
.imp-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imp-seg{display:inline-grid;grid-template-columns:repeat(2,auto)}
.imp-seg button{padding:7px 12px}
#gImpDocBox{scroll-margin-top:84px}
@media (max-width:860px){.imp-grid{grid-template-columns:1fr}.imp-lista{position:static;max-height:none}.imp-scroll{max-height:46vh}.imp-acts{width:100%;flex-direction:column;align-items:stretch}.imp-acts .imp-seg{display:grid;grid-template-columns:1fr 1fr}.imp-acts .btn{justify-content:center}}
@media print{.imp-grid{display:block}.imp-doc{display:block}}
.updbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface);padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);font-size:14px;font-weight:600;max-width:calc(100vw - 32px)}
@media (max-width:860px){.updbar{bottom:calc(76px + env(safe-area-inset-bottom))}}
/* Painel: ausências de hoje e balanço semanal do efetivo */
.g-ef{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
@media (max-width:1180px){.g-ef{grid-template-columns:minmax(0,1fr)}}
.aus-mini{margin:0 0 12px}
.aus-l{display:flex;flex-direction:column;max-height:300px;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.aus-it{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;padding:8px 4px;cursor:pointer}
.aus-it:hover{background:var(--surface-2)}
.aus-it b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aus-it small{display:block;font-size:11.5px;color:var(--ink-3)}
table.bal th[scope=row]{text-align:left;font-weight:600;white-space:nowrap}
table.bal tr.mot th,table.bal tr.mot td{color:var(--ink-3);font-weight:400;font-size:12.5px;padding-top:3px;padding-bottom:3px}
table.bal tr.mot .sub{padding-left:12px}
table.bal tr.aus td{color:var(--st-nreal);font-weight:600}
table.bal tr.saldo td.neg{color:var(--st-nreal);font-weight:700}
table.bal tr.saldo td.pos{color:var(--st-real);font-weight:700}
table.bal td.tot{background:var(--surface-2);font-weight:600}
.pt0{padding-top:0}
/* Busca com lista abaixo do campo (operadores, equipamentos) */
.cbx{position:relative;display:flex;flex-direction:column}
.cbx-in{position:relative}
.cbx-in svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.cbx-in .in{width:100%;padding-left:34px;padding-right:34px}
.cbx-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-3);width:26px;height:26px;border-radius:6px;cursor:pointer}
.cbx-x:hover{background:var(--surface-2);color:var(--ink)}
.cbx-l{margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:232px;overflow:auto;padding:4px;box-shadow:var(--shadow)}
.cbx-o{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:7px 9px;border-radius:7px;cursor:pointer}
.cbx-o b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbx-o small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbx-o:hover,.cbx-o[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.cbx span{font-size:inherit;letter-spacing:normal;text-transform:none;color:inherit;font-weight:inherit}
.cbx .pill{font-size:11px;font-weight:600}
.cbx-vz{margin:0;padding:8px 10px;font-size:12.5px;color:var(--ink-3)}
.lbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lbar .srch{flex:1;min-width:220px;max-width:460px}
.opbar .rchips{flex:1 1 auto}
.ajuda{line-height:1.5}
.avisos:empty{display:none}
.avisos{display:flex;flex-direction:column;gap:6px}
.aviso{margin:0;padding:8px 10px;border-radius:8px;font-size:12.5px;background:color-mix(in srgb,var(--st-atr) 13%,transparent);color:var(--ink);border-left:3px solid var(--st-atr)}
.conf .body{display:flex;flex-direction:column;gap:10px}
.conf-l{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.conf-l small{color:var(--ink-3)}

/* Efetivo diário: presente com ✓ verde e seletor rápido */

.sit.P svg{width:15px;height:15px;vertical-align:middle}
.sit.fut{opacity:.55}
.sit:not([disabled]){cursor:pointer;transition:transform .12s var(--ease),box-shadow .12s}

.sitleg .sit{width:26px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;margin-right:2px}

.sitleg>span{display:inline-flex;align-items:center;gap:4px}
table.efd tfoot th,table.efd tfoot td{border-top:2px solid var(--line);font-size:12.5px}

.efbar .efrota{margin:0;min-width:240px}
.sitpop{position:fixed;z-index:90;width:300px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--e3,0 12px 32px rgba(0,0,0,.2));padding:12px;display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:no-preference){.sitpop{animation:spIn .14s var(--ease) both}@keyframes spIn{from{opacity:0;transform:translateY(-4px) scale(.98)}}}
.sp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.sp-h b{font-size:13.5px}.sp-h small{color:var(--ink-3);font-size:12px;white-space:nowrap}
.sp-g{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.sp-o{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;color:var(--ink);border-radius:8px;padding:5px 6px;font-size:13px;text-align:left;cursor:pointer}
.sp-o:hover,.sp-o:focus-visible{background:var(--surface-2);outline:none;border-color:var(--line)}
.sp-o[aria-current="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.sp-o .sit{width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:none;pointer-events:none}
.sp-rep{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:9px;cursor:pointer}

.pill svg{width:12px;height:12px;vertical-align:-2px;margin-right:2px}
.btn svg{flex:none}
/* Módulo Escala e Efetivo */
.setsw{display:inline-grid;grid-template-columns:repeat(2,auto);align-self:flex-end}
.setsw button{padding:7px 16px}
table.efd tr.grp-row th{background:var(--surface-2);text-align:left;padding-top:8px;padding-bottom:8px;font-size:13px}
table.efd tr.grp-row .btn.link{font-weight:700;padding:0}
table.efd tr.grp-row .gcount{float:right;font-weight:500;font-size:12px;color:var(--ink-3)}
.sit.ro{display:inline-flex;align-items:center;justify-content:center;cursor:default}
.tbtn{margin-left:6px;border:0;background:color-mix(in srgb,var(--surface) 18%,transparent);color:inherit;font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:7px;cursor:pointer}
.tbtn:hover{background:color-mix(in srgb,var(--surface) 30%,transparent)}
table.efd tr.grp-row .gcount{text-transform:none;letter-spacing:0}
.btn.ic{width:34px;height:32px;padding:0;justify-content:center}
.btn.ic svg{width:16px;height:16px}
td.acts{white-space:nowrap}td.acts .btn+.btn{margin-left:4px}
.ajuda svg{width:13px;height:13px;vertical-align:-2px}
/* Escala de turno */
.sit.auto{background:none!important;border:1px dashed var(--line)!important;color:var(--ink-3)!important;font-weight:500}
.sitleg .sit.auto{border-style:dashed}
.hojeturma{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--st-real) 13%,transparent);color:var(--st-real)}
.tchip.mut{background:var(--surface-2);color:var(--ink-3)}
.sp-esc{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 9px}
.sp-esc .btn.link{padding:0;font-size:12px}
.semt{color:var(--st-atr);font-weight:600}
.turma-b{padding:0;font-size:inherit;font-weight:400;color:inherit;text-align:left}
.turma-b:hover{color:var(--accent)}
/* Módulo Configurações */
.cfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
.cfc{margin:0}
.cfc header{display:flex;align-items:flex-start;gap:12px}
.cfi{flex:none;width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.cfi svg{width:20px;height:20px}
.cfkv{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0 0 14px}
.cfkv dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.cfkv dd{margin:2px 0 0;font-size:14px;font-weight:600}
.cfb{flex-wrap:wrap}
table.calesc th[scope=row]{text-align:left;white-space:nowrap;font-weight:500}
table.calesc th.fds{color:var(--ink-3)}
.cdot{display:inline-block;width:22px;font-size:13px;line-height:1}
.cdot.on{color:var(--st-real)}.cdot.off{color:var(--ink-3)}.cdot.nd{color:var(--st-atr);font-weight:700}
.cfreg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.regc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.regh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.regh b{font-size:14.5px}
.mini-in{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}.mini-in .in{width:64px}
.turl{display:flex;flex-direction:column;gap:6px}
.turi{display:flex;align-items:center;gap:8px}.turi .in{flex:1;min-width:0}
.turi .tl{flex:none;width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:var(--surface-2)}
.turi.add .in{max-width:90px}
.savebar{border-top:1px solid var(--line);align-items:center}
/* Substituição e origem da hora extra */
.sit{position:relative;min-width:34px;width:auto!important;padding:0 5px!important;white-space:nowrap}
.sitleg .sit{min-width:26px}
.sit sup{font-size:8.5px;font-weight:800;margin-left:1px;vertical-align:4px}
.sit .cobi{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:9px;line-height:15px;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.sitleg .sit .cobi{top:-5px;right:-5px;width:12px;height:12px;line-height:12px;font-size:8px}
.sp-cob{font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.sp-cob.none{background:var(--surface-2);color:var(--ink-2)}
.sp-cob svg{width:13px;height:13px}
.sp-cob .btn.link{padding:0;font-size:12.5px}
.sp-heo{display:flex;gap:6px;flex-wrap:wrap}
.sp-heo .btn{flex:1;justify-content:center;min-width:110px}
.sp-ok{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--st-real)}
.sp-ok svg{width:14px;height:14px}
.sitpop .sel{margin:0}
@media (max-width:860px){.sitpop{left:8px!important;right:8px;width:auto;max-width:none;top:auto!important;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-height:calc(100vh - 150px);overflow:auto}}
.sitpop .cbx-l{max-height:200px}
.pitem .l.resp{margin-top:3px;color:var(--ink-2)}
.pitem .l.resp .btn.link{padding:0;font-size:12px}
/* Perfis e permissões: chave liga/desliga */
.tgl{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background-color var(--t1,.15s),border-color var(--t1,.15s)}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink-3,#999);transition:transform .15s,background-color .15s}
.tgl:checked{background:var(--st-real);border-color:var(--st-real)}
.tgl:checked::after{transform:translateX(16px);background:#fff}
.tgl:disabled{opacity:.35;cursor:not-allowed}
.tgl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table.perm td.c,table.perm th.c{text-align:center}
table.perm th.c small{font-weight:400;text-transform:none;letter-spacing:0}
table.perm tr.grp-row th{background:var(--surface-2);text-align:left;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;padding-top:10px;padding-bottom:10px}
.tag-adm{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2);margin-left:4px;vertical-align:1px}
.abas-p{display:flex;flex-direction:column;gap:14px;max-height:52vh;overflow:auto;margin:4px 0 12px;padding-right:4px}
.abas-g{display:flex;flex-direction:column;gap:2px}
.abas-g>b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin-bottom:4px}
.tgl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.exc-t{color:var(--st-extra);font-weight:600;margin-left:4px}
.pill.ext{background:color-mix(in srgb,var(--st-extra) 14%,transparent);color:var(--st-extra)}

.mini{display:flex;gap:10px;flex-wrap:wrap}
.mini div{display:flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:96px}
.mini b{font-family:var(--f-display);font-size:22px;line-height:1.1}
.mini span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.ef{height:6px;width:80px;background:var(--line-2);border-radius:3px;display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}
.ef i{display:block;height:100%;background:var(--st-real)}

/* mobile cards */
.mlist{display:flex;flex-direction:column;gap:8px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.mcard .t{font-weight:600}
.mcard .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcard .days div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-3)}
.mcard .days .chip{width:100%;max-width:40px;height:34px}
.mgrp{font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;padding:10px 2px 2px}

/* apontar */
.dayscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:54px}
.dbtn small{font-size:10.5px;letter-spacing:.08em;color:var(--ink-3)}
.dbtn b{font-family:var(--f-display);font-size:20px;line-height:1}
.dbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dbtn[aria-pressed="true"] small{color:inherit;opacity:.75}
.dbtn.hoje b::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:2px auto 0}
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.rchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:500;display:flex;gap:6px;align-items:center}
.rchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rchip .c{font-size:11px;opacity:.7}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .stack{height:10px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;position:relative}
.act::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--st-prog)}
.act.R::before{background:var(--st-real)}.act.N::before{background:var(--st-nreal)}.act.E::before{background:var(--st-extra)}.act.A::before{background:var(--st-atr)}
.act .t{font-weight:600;line-height:1.3}
.act .l{font-size:12px;color:var(--ink-3);margin-top:2px}
.act .m{font-size:12px;color:var(--st-nreal);margin-top:4px}
.act .bt{display:flex;gap:6px}
.ok-btn,.no-btn{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;font-weight:700}
.ok-btn{color:var(--st-real)}.no-btn{color:var(--st-nreal)}
.ok-btn[aria-pressed="true"]{background:var(--st-real);border-color:var(--st-real);color:#fff}
.no-btn[aria-pressed="true"]{background:var(--st-nreal);border-color:var(--st-nreal);color:#fff}

/* escala */
.cell{font-size:12.5px;font-weight:600;border-radius:4px;padding:3px 0;display:block;text-align:center;min-width:44px}
.cell.ok{background:color-mix(in srgb,var(--st-real) 12%,transparent);color:var(--st-real)}
.cell.bad{background:color-mix(in srgb,var(--st-nreal) 15%,transparent);color:var(--st-nreal)}
.cell.neu{color:var(--ink-3)}
.sit{width:34px;height:28px;border-radius:5px;border:1px solid var(--line);background:none;font-size:11.5px;font-weight:600;padding:0}
.sit.F,.sit.FE{background:color-mix(in srgb,var(--st-prog) 16%,transparent);color:var(--ink-2);border-color:transparent}
.sit.AT,.sit.AF,.sit.FT,.sit.DS{background:color-mix(in srgb,var(--st-nreal) 16%,transparent);color:var(--st-nreal);border-color:transparent}
.sit.TR,.sit.HE{background:color-mix(in srgb,var(--st-extra) 16%,transparent);color:var(--st-extra);border-color:transparent}
.sit.ATR{background:color-mix(in srgb,var(--st-atr) 16%,transparent);color:var(--st-atr);border-color:transparent}

/* pendências */
.plist{display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.pitem:last-child{border-bottom:0}
.pitem .t{font-weight:600}
.pitem .l{font-size:12px;color:var(--ink-3)}
.log{display:flex;flex-direction:column;gap:0;font-size:12.5px}
.log div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.log div:last-child{border-bottom:0}
.log time{color:var(--ink-3);font-family:var(--f-mono);font-size:11.5px}

/* plano */
.tog{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:none;font-size:12px;font-weight:700;padding:0;color:transparent}
.tog[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form .wide{grid-column:span 2}
.form .in{width:100%}

/* papel */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:var(--shadow);padding:28px;font-size:11.5px;max-width:1000px}
.paper h3{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.paper .hd{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:10px}
.paper .meta{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:6px}
.paper table{font-size:11px;color:var(--paper-ink)}
.paper th{background:none;color:var(--paper-ink);border:1px solid var(--paper-line);position:static;font-size:9.5px;padding:5px}
.paper td{border:1px solid var(--paper-line);padding:4px 5px}
.paper tr.grp td{background:#ECEDEF;color:var(--paper-ink);font-size:12px}
.paper .box{display:inline-block;width:13px;height:13px;border:1.4px solid var(--paper-ink);border-radius:2px}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px}
.paper .sign div{border-top:1px solid var(--paper-ink);padding-top:4px;text-align:center}

/* sheet / dialog */
.scrim{position:fixed;inset:0;background:rgba(10,13,17,.45);z-index:60;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(420px,100%);max-height:85vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--f-display);font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.sheet .sub{font-size:12.5px;color:var(--ink-3);margin-top:-6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;text-align:left;font-weight:500}
.opt:hover{border-color:var(--ink-3)}
.opt .chip{pointer-events:none;width:26px;height:26px;font-size:13px}
.opt .sit{pointer-events:none}
.opt[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:80;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}

.tabbar{display:none}
.mobile-only{display:none}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi.hero{grid-column:span 3}.grid2{grid-template-columns:minmax(0,1fr)}}

  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

  .kpi .v{font-size:28px}
  .barrow{grid-template-columns:96px minmax(0,1fr) 44px;gap:8px}
  .cols{gap:5px;height:140px}

   Uma só linguagem de movimento: rápido, sem quique, sempre respondendo a uma ação.

.pgrp{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;margin-top:6px;color:var(--ink)}
button.pgrp:hover{border-color:var(--line)}
.pgrp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.pgrp .pg-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;min-width:0}
.pgrp b{font-family:var(--f-display);font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.pgrp small{color:var(--ink-3);font-size:12px}
.pgrp .pres{margin-left:auto;font-size:12.5px;color:var(--ink-2)}
.pgrp .atr{color:var(--st-atr);font-weight:600}
.pgrp .chev{width:16px;height:16px;color:var(--ink-3);transition:transform var(--t2) var(--ease)}
.pgrp.on .chev{transform:rotate(90deg)}
tr.grp td .pgrp{margin:0;border:0;background:transparent;padding:2px 0}
.pgtool{align-items:center}
/* Efetivo diário: rotas recolhidas e legenda escondida */
.efg{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);font:inherit}
.efg .chev{width:14px;height:14px;color:var(--ink-3);transition:transform var(--t2) var(--ease)}
.efg.on .chev{transform:rotate(90deg)}
details.legdet>summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);padding:6px 0;list-style:none}
details.legdet>summary::-webkit-details-marker{display:none}
details.legdet>summary::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);margin-right:6px;font-size:11px;font-weight:700}
details.legdet[open]>summary{margin-bottom:6px}
/* Meu dia: Agora e Hoje */
.md-top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.md-agora .body{display:grid;gap:0;padding-top:4px}
.md-task{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.md-task:first-child{border-top:0}
.md-task .s{align-self:stretch;border-radius:2px;background:var(--st-prog)}
.md-task.bad .s{background:var(--st-nreal)}.md-task.warn .s{background:var(--st-atr)}
.md-task b{display:block;font-size:14px}
.md-task b .num{font-family:var(--f-display);font-size:19px;margin-right:2px}
.md-task.bad b .num{color:var(--st-nreal)}.md-task.warn b .num{color:var(--st-atr)}
.md-task small{display:block;color:var(--ink-3);font-size:12px}
.md-mais>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);padding:8px 0;border-top:1px solid var(--line-2)}
.md-ok{color:var(--ink-2)}
.md-prog{display:grid;gap:6px;width:100%;text-align:left;background:none;border:0;padding:0;color:var(--ink)}
.md-prog b{font-size:14px}
.md-chips{display:flex;flex-wrap:wrap;gap:6px}
.md-chip{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.md-chip b{color:var(--ink)}
.md-grid{margin-top:16px}
@media (max-width:860px){
  .md-top{grid-template-columns:minmax(0,1fr);gap:12px}
  .md-hero h2{font-size:24px}
  .top .buscabtn{position:absolute;right:12px;top:8px;padding:6px 8px}
  .top .buscabtn span,.top .buscabtn kbd{display:none}
  .syncwrap{right:56px}
  .top h1{padding-right:170px}
  body.rolou .top h1 small{display:none}
  body.rolou .top h1{font-size:19px}
  .mini{gap:6px}.mini div{padding:8px 10px}
  .pgrp{grid-template-columns:auto minmax(0,1fr)}
  .pgrp .pres{grid-column:2;margin-left:0}
  .mini{display:flex!important;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px}
  .mini::-webkit-scrollbar{display:none}
  .mini div{flex:none;flex-direction:row;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;box-shadow:none}
  .mini b{font-size:17px}
  .mini span{font-size:10.5px;letter-spacing:.03em;white-space:nowrap}
}
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><p>Carregando…</p></div></div>
<div class="app" id="shell" hidden>
  <aside class="rail" aria-label="Menu">
    <div class="brand"><img class="logo" src="img/dikma-logo-branco.png" alt="Dikma" width="104" height="34"><div class="prod"><b>OPERAÇÃO</b></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main>
    <div class="top" id="top"></div>
    <div class="wrap" id="view"></div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Navegação"></nav>
</div>
<div id="layer"></div>
<noscript>Ative o JavaScript para usar o sistema.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
