<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dikma Operação</title>
<meta name="theme-color" content="#1C1B4A">
<meta name="description" content="Dikma Operação — Programação de atividades">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: app shell — dark graphite rail on desktop, bottom tab bar on phones; content is a scanning surface of filters → summary → detail. */
:root{
  --bg:#EEEFF4; --surface:#FFFFFF; --surface-2:#F5F5F9; --line:#D9DAE4; --line-2:#E7E8EF;
  --ink:#16172E; --ink-2:#4A4B66; --ink-3:#787A93;
  --rail:#1C1B4A; --rail-2:#2A2963; --rail-ink:#CFCFE6; --rail-ink-2:#8E8FB8;
  --navy:#272662; --accent:#F05A26; --accent-ink:#FFFFFF; --focus:#3D3AB5;
  --st-prog:#5F6385; --st-real:#1E8A4C; --st-nreal:#D23B3B; --st-extra:#7A4FD6; --st-atr:#B98200;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#9AA1AB;
  --shadow:0 1px 2px rgba(16,22,30,.06),0 4px 16px rgba(16,22,30,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F1C; --surface:#171829; --surface-2:#1D1E33; --line:#2C2D47; --line-2:#24253B;
  --ink:#E8E8F2; --ink-2:#AAABC4; --ink-3:#7A7B97;
  --rail:#0B0B1C; --rail-2:#1A1A3A; --rail-ink:#CFCFE6; --rail-ink-2:#7E7FA6;
  --accent:#F26A3A; --focus:#8C8AF0;
  --st-prog:#9093B2; --st-real:#3CB872; --st-nreal:#EE6262; --st-extra:#A486EE; --st-atr:#E3B23C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F1C; --surface:#171829; --surface-2:#1D1E33; --line:#2C2D47; --line-2:#24253B;
  --ink:#E8E8F2; --ink-2:#AAABC4; --ink-3:#7A7B97;
  --rail:#0B0B1C; --rail-2:#1A1A3A; --rail-ink:#CFCFE6; --rail-ink-2:#7E7FA6;
  --accent:#F26A3A; --focus:#8C8AF0;
  --st-prog:#9093B2; --st-real:#3CB872; --st-nreal:#EE6262; --st-extra:#A486EE; --st-atr:#E3B23C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
h1,h2,h3{margin:0;text-wrap:balance}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:34px;height:34px;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.brand b{display:block;font-family:var(--f-display);font-size:19px;letter-spacing:.02em;color:#fff;line-height:1.05}
.brand small{color:var(--rail-ink-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink-2);padding:12px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--rail-ink);padding:9px 10px;border-radius:6px;text-align:left;font-size:13.5px;position:relative}
.nav button:hover{background:var(--rail-2)}
.nav button[aria-current="page"]{background:var(--rail-2);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.nav .badge{margin-left:auto;background:var(--st-atr);color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:0 7px;line-height:18px}
.nav svg,.tabbar svg{width:18px;height:18px;flex:none}
.who{margin-top:auto;border-top:1px solid var(--rail-2);padding:14px 6px 0;display:flex;flex-direction:column;gap:8px}
.who label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink-2)}
.who select{background:var(--rail-2);border:1px solid #2B323C;border-radius:6px;padding:8px;color:#fff;width:100%}
.who .role{font-size:12px;color:var(--rail-ink-2)}

/* main */
main{min-width:0;padding-block:0 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.top h1{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1;margin-right:auto}
.top h1 small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.02em;margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{display:flex;flex-direction:column;gap:2px}
.sel span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
select.in,input.in{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
input.in{min-width:180px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--st-nreal)}
.btn svg{width:16px;height:16px}
.wrap{padding:20px 28px;display:flex;flex-direction:column;gap:20px}
.demo{margin:14px 28px 0;display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;padding:10px 14px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.demo b{color:var(--ink)}
.demo .btn{padding:4px 10px;font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;padding:14px 16px 0}
.card>header h2{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.card>header p{margin:0;color:var(--ink-3);font-size:12.5px}
.card>header .r{margin-left:auto;min-width:0;max-width:100%}
.card>header .r select{max-width:100%}
td.mono{white-space:nowrap}
.card .body{padding:14px 16px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.muted{color:var(--ink-3)}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* KPI */
.kpis{display:grid;grid-template-columns:1.4fr repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi.hero .v{font-size:52px}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.meter{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--st-real);border-radius:3px}

/* stacked bars */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.barrow .n{font-weight:600;font-size:13px}
.barrow .n small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px}
.barrow .p{font-family:var(--f-display);font-size:20px;font-weight:700;text-align:right}
.stack{display:flex;gap:2px;height:16px;border-radius:4px;overflow:hidden;background:var(--line-2)}
.stack i{display:block;height:100%;min-width:0}
.barrow:hover .n{text-decoration:underline}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:170px;margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:0}
.col{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;position:relative}
.col i{display:block;width:100%;border-radius:0}
.col i:first-child{border-radius:4px 4px 0 0}
.colx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:6px;text-align:center;font-size:11.5px;color:var(--ink-3)}
.colx b{display:block;color:var(--ink);font-weight:600;font-size:12px}
.colx .today b{color:var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:3px;display:inline-block;padding:0 5px}
.col .tot{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-2)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr.grp td{background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;padding:8px 10px;color:var(--ink)}
tr.grp td small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;color:var(--ink-3);margin-left:8px}
td.c,th.c{text-align:center}
td.r,th.r{text-align:right}
th.today{background:color-mix(in srgb,var(--accent) 28%,var(--surface-2));color:var(--ink)}
td.today{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.loc{color:var(--ink-3);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink-2);white-space:nowrap}

/* day chips */
.chip{width:30px;height:30px;border-radius:6px;border:1.5px solid transparent;display:inline-grid;place-items:center;font-size:14px;font-weight:700;background:none;padding:0;line-height:1}
.chip.P{border-color:var(--st-prog);color:var(--st-prog)}
.chip.R{background:var(--st-real);color:#fff}
.chip.N{background:var(--st-nreal);color:#fff}
.chip.E{background:var(--st-extra);color:#fff}
.chip.A{border-color:var(--st-atr);color:var(--st-atr);background:color-mix(in srgb,var(--st-atr) 12%,transparent)}
.chip.X{color:var(--line);font-size:18px}
.chip.X:hover{color:var(--ink-3);border-color:var(--line)}
.chip:hover{filter:brightness(1.08)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--st-real) 14%,transparent);color:var(--st-real)}
.pill.bad{background:color-mix(in srgb,var(--st-nreal) 14%,transparent);color:var(--st-nreal)}
.pill.warn{background:color-mix(in srgb,var(--st-atr) 14%,transparent);color:var(--st-atr)}
.pill.neu{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.ext{background:color-mix(in srgb,var(--st-extra) 14%,transparent);color:var(--st-extra)}

.mini{display:flex;gap:10px;flex-wrap:wrap}
.mini div{display:flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:96px}
.mini b{font-family:var(--f-display);font-size:22px;line-height:1.1}
.mini span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.ef{height:6px;width:80px;background:var(--line-2);border-radius:3px;display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}
.ef i{display:block;height:100%;background:var(--st-real)}

/* mobile cards */
.mlist{display:flex;flex-direction:column;gap:8px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.mcard .t{font-weight:600}
.mcard .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcard .days div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-3)}
.mcard .days .chip{width:100%;max-width:40px;height:34px}
.mgrp{font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;padding:10px 2px 2px}

/* apontar */
.dayscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:54px}
.dbtn small{font-size:10.5px;letter-spacing:.08em;color:var(--ink-3)}
.dbtn b{font-family:var(--f-display);font-size:20px;line-height:1}
.dbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dbtn[aria-pressed="true"] small{color:inherit;opacity:.75}
.dbtn.hoje b::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:2px auto 0}
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.rchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:500;display:flex;gap:6px;align-items:center}
.rchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rchip .c{font-size:11px;opacity:.7}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .stack{height:10px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;position:relative}
.act::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--st-prog)}
.act.R::before{background:var(--st-real)}.act.N::before{background:var(--st-nreal)}.act.E::before{background:var(--st-extra)}.act.A::before{background:var(--st-atr)}
.act .t{font-weight:600;line-height:1.3}
.act .l{font-size:12px;color:var(--ink-3);margin-top:2px}
.act .m{font-size:12px;color:var(--st-nreal);margin-top:4px}
.act .bt{display:flex;gap:6px}
.ok-btn,.no-btn{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;font-weight:700}
.ok-btn{color:var(--st-real)}.no-btn{color:var(--st-nreal)}
.ok-btn[aria-pressed="true"]{background:var(--st-real);border-color:var(--st-real);color:#fff}
.no-btn[aria-pressed="true"]{background:var(--st-nreal);border-color:var(--st-nreal);color:#fff}

/* escala */
.cell{font-size:12.5px;font-weight:600;border-radius:4px;padding:3px 0;display:block;text-align:center;min-width:44px}
.cell.ok{background:color-mix(in srgb,var(--st-real) 12%,transparent);color:var(--st-real)}
.cell.bad{background:color-mix(in srgb,var(--st-nreal) 15%,transparent);color:var(--st-nreal)}
.cell.neu{color:var(--ink-3)}
.sit{width:34px;height:28px;border-radius:5px;border:1px solid var(--line);background:none;font-size:11.5px;font-weight:600;padding:0}
.sit.P{color:var(--ink-3);border-style:dashed}
.sit.F,.sit.FE{background:color-mix(in srgb,var(--st-prog) 16%,transparent);color:var(--ink-2);border-color:transparent}
.sit.AT,.sit.AF,.sit.FT,.sit.DS{background:color-mix(in srgb,var(--st-nreal) 16%,transparent);color:var(--st-nreal);border-color:transparent}
.sit.TR,.sit.HE{background:color-mix(in srgb,var(--st-extra) 16%,transparent);color:var(--st-extra);border-color:transparent}
.sit.ATR{background:color-mix(in srgb,var(--st-atr) 16%,transparent);color:var(--st-atr);border-color:transparent}

/* pendências */
.plist{display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.pitem:last-child{border-bottom:0}
.pitem .t{font-weight:600}
.pitem .l{font-size:12px;color:var(--ink-3)}
.log{display:flex;flex-direction:column;gap:0;font-size:12.5px}
.log div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.log div:last-child{border-bottom:0}
.log time{color:var(--ink-3);font-family:var(--f-mono);font-size:11.5px}

/* plano */
.tog{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:none;font-size:12px;font-weight:700;padding:0;color:transparent}
.tog[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form .wide{grid-column:span 2}
.form .in{width:100%}

/* papel */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:var(--shadow);padding:28px;font-size:11.5px;max-width:1000px}
.paper h3{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.paper .hd{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:10px}
.paper .meta{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:6px}
.paper table{font-size:11px;color:var(--paper-ink)}
.paper th{background:none;color:var(--paper-ink);border:1px solid var(--paper-line);position:static;font-size:9.5px;padding:5px}
.paper td{border:1px solid var(--paper-line);padding:4px 5px}
.paper tr.grp td{background:#ECEDEF;color:var(--paper-ink);font-size:12px}
.paper .box{display:inline-block;width:13px;height:13px;border:1.4px solid var(--paper-ink);border-radius:2px}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px}
.paper .sign div{border-top:1px solid var(--paper-ink);padding-top:4px;text-align:center}

/* sheet / dialog */
.scrim{position:fixed;inset:0;background:rgba(10,13,17,.45);z-index:60;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(420px,100%);max-height:85vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--f-display);font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.sheet .sub{font-size:12.5px;color:var(--ink-3);margin-top:-6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;text-align:left;font-weight:500}
.opt:hover{border-color:var(--ink-3)}
.opt .chip{pointer-events:none;width:26px;height:26px;font-size:13px}
.opt .sit{pointer-events:none}
.opt[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:80;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}

.tabbar{display:none}
.mobile-only{display:none}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi.hero{grid-column:span 3}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-only{display:revert}
  .top{padding:10px 16px}
  .top h1{font-size:23px;width:100%}
  .filters{width:100%}
  .filters .sel{flex:1 1 120px}
  .filters select.in{width:100%}
  input.in{min-width:0;width:100%}
  .wrap{padding:16px}
  .demo{margin:12px 16px 0}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);padding:4px 0;position:relative}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button[aria-current="page"] svg{color:var(--ink)}
  .tabbar .big span.ic{background:var(--accent);color:var(--accent-ink);border-radius:12px;width:44px;height:30px;display:grid;place-items:center}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--st-atr);color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:0 5px;line-height:15px}
  .scrim{place-items:end center;padding:0}
  .sheet{width:100%;border-radius:14px 14px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.hero{grid-column:span 2}
  .kpi .v{font-size:28px}
  .barrow{grid-template-columns:96px minmax(0,1fr) 44px;gap:8px}
  .cols{gap:5px;height:140px}
  .colx{gap:5px}
  .paper{padding:14px}
  .form .wide{grid-column:auto}
  .card>header .r{margin-left:0;flex:1 1 100%}
  .card>header .r select{width:100%}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translate(var(--tx,0),10px);opacity:.4}}.toast{--tx:-50%}}
@media print{
  body{background:#fff}
  .rail,.top,.tabbar,.demo,.noprint{display:none!important}
  .app{display:block}.wrap{padding:0}
  .paper{box-shadow:none;padding:0;max-width:none}
}

.brand.big b{font-size:26px;color:var(--navy)}.brand.big small{color:var(--ink-3)}
.logo.on-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand.big .logo.on-light{display:none}:root:not([data-theme="light"]) .brand.big .logo.on-dark{display:block}:root:not([data-theme="light"]) .brand.big b{color:var(--ink)}}
:root[data-theme="dark"] .brand.big .logo.on-light{display:none}:root[data-theme="dark"] .brand.big .logo.on-dark{display:block}:root[data-theme="dark"] .brand.big b{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--rail-2)}
.paper .plogo{height:30px;width:auto}
.tabbar .big span.ic{color:#fff}
#gate{min-height:100%;display:grid;place-items:center;padding:32px 16px;background:
  repeating-linear-gradient(135deg,transparent 0 22px,color-mix(in srgb,var(--navy,var(--ink)) 5%,transparent) 22px 23px),var(--bg)}
.gatecard{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:16px}
.gatecard h2{font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.gatecard p{margin:0}
.gatecard code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.gbtn{justify-content:center;padding:11px 14px;font-size:15px;background:var(--surface);border-color:var(--ink-3)}
.gatecard a{color:var(--ink-2)}
.me{display:flex;gap:10px;align-items:center;min-width:0}
.me img,.me .av{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover}
.me .av{display:grid;place-items:center;background:var(--rail-2);color:#fff;font-weight:600}
.me b{display:block;color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--rail-ink-2);font-size:11.5px}
.me>div{min-width:0}
.rail-btn{background:var(--rail-2);border-color:#2B323C;color:var(--rail-ink);justify-content:center}
.rail-btn:hover{border-color:var(--rail-ink-2)}
.who .sel span{color:var(--rail-ink-2)}
.who select.in{background:var(--rail-2);border-color:#2B323C;color:#fff}
@media (max-width:860px){.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.mini div{min-width:0}.syncwrap{order:-1;position:absolute;right:16px;top:12px}.top{position:sticky}.top h1{padding-right:120px}}
@media print{#gate,.syncwrap{display:none!important}.paper{min-width:0}}
