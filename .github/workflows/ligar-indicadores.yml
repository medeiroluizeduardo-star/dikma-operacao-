name: Ligar Indicadores para quem já via

# Liga o módulo Indicadores (perfil Vê) para quem tinha Operação, Gestão, Segurança ou RH (PR #135).
# Só manual (Run workflow), depois de publicar. Rode antes a Cópia de segurança.
#   simular (padrão): só mostra quem ganharia o módulo.
#   gravar: guarda uma cópia do acesso de cada um na coleção backups e grava.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular (só mostra) ou gravar'
        type: choice
        options: [simular, gravar]
        default: simular

permissions:
  contents: read

concurrency:
  group: banco
  cancel-in-progress: false

jobs:
  ligar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Ligar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIGAR_MODO: ${{ inputs.modo }}
        run: |
          npm install --no-audit --no-fund --prefix integracao/admin
          node integracao/admin/ligar-indicadores.mjs
