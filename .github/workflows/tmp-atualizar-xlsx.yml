name: TEMPORÁRIO - atualizar leitor de planilhas

# Usado uma vez nesta proposta para trazer a versão corrigida do SheetJS (0.20.3) direto do site oficial.
# É apagado no commit seguinte.
on:
  push:
    branches: [etapa1-avisos-areas-seguranca]
    paths: ['.github/workflows/tmp-atualizar-xlsx.yml']

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Baixar e conferir
        run: |
          curl -sSfL https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs -o /tmp/xlsx.mjs
          grep -q 'version = "0.20.3"\|version="0.20.3"\|"0.20.3"' /tmp/xlsx.mjs
          grep -q 'export' /tmp/xlsx.mjs
          ls -la /tmp/xlsx.mjs
          sha256sum /tmp/xlsx.mjs
          cp /tmp/xlsx.mjs public/vendor/xlsx.js
      - name: Gravar na proposta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vendor/xlsx.js
          git commit -m "Leitor de planilhas SheetJS 0.20.3 (corrige falhas conhecidas da 0.18.5)"
          git push
