name: Converter acessos

# Fase 1 da divisão em 5 módulos: converte o cadastro dos usuários (papel e módulos) para o acesso por módulo
# (campos acesso e escopos). Só manual (Run workflow).
#   simular (padrão): só mostra, no resumo desta execução, como cada usuário está e como fica, com avisos.
#   gravar: faz uma cópia dos usuários (arquivo desta execução + coleção backups) e grava só acesso e escopos,
#           pulando quem já foi convertido. Papel, módulos e áreas ficam como estão.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular (só mostra) ou gravar'
        type: choice
        options: [simular, gravar]
        default: simular

permissions:
  contents: read

concurrency:
  group: banco
  cancel-in-progress: false

jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Converter (${{ inputs.modo }})
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_PASTA: copia-usuarios
        run: |
          npm install --no-audit --no-fund --prefix integracao/admin
          node integracao/admin/converter-acessos.mjs --${{ inputs.modo == 'gravar' && 'gravar' || 'simular' }}

      - name: Guardar a cópia dos usuários
        if: inputs.modo == 'gravar'
        uses: actions/upload-artifact@v4
        with:
          name: usuarios-antes-da-conversao-${{ github.run_id }}
          path: copia-usuarios/
          retention-days: 90
          if-no-files-found: error
