name: Testes automáticos

# Confere que o site não tem dados pessoais e testa as regras de segurança e as rotinas no emulador do Firebase (testar).
# Em paralelo, abre o site no modo demonstração num navegador e passa por todas as telas, no computador e no celular (telas).
# Roda em toda proposta de mudança (pull request) e antes de cada publicação (chamado pelo blank.yml).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Site sem dados pessoais
        run: node ferramentas/conferir-site.mjs

      - name: Instalar
        run: |
          npm install --no-audit --no-fund --prefix integracao/admin
          npm install --no-audit --no-fund --prefix testes

      - name: Checagem de tipos (contas/)
        working-directory: testes
        run: npm run tipos

      - name: Regras de segurança e rotinas (emulador do Firebase)
        working-directory: testes
        run: npx firebase emulators:exec --only firestore,auth --project demo-dikma --config ../firebase.json "npm test"

      - name: Resultado
        if: always()
        working-directory: testes
        run: |
          if [ ! -f resultado.tap ]; then echo "::error title=Testes::Os testes não chegaram a rodar."; exit 1; fi
          ok=$(grep -cE '^ *ok [0-9]+ ' resultado.tap || true)
          falhou=$(grep -cE '^ *not ok [0-9]+ ' resultado.tap || true)
          grep -E '^ *not ok [0-9]+ ' resultado.tap | sed -E 's/^ *not ok [0-9]+ - /::error title=Teste falhou::/' || true
          # detalhe de cada falha (mensagem e linha do teste), numa linha só
          awk '/^ *not ok [0-9]+ /{f=1; n=$0; d=""; next} f && /^ *\.\.\.$/{print "::error title=Detalhe::" n " | " d; f=0; next} f{gsub(/^ +/,""); if (length(d) < 900) d=d " " $0}' resultado.tap || true
          echo "::notice title=Testes::$ok passaram, $falhou falharam"
          { echo "### Testes automáticos"; echo "$ok passaram, $falhou falharam"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$falhou" = "0" ] && [ "$ok" -gt 0 ]

  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar o navegador (Chromium)
        run: |
          # Só o Playwright, numa pasta à parte (sem as ferramentas do Firebase, que este teste não usa).
          V=$(jq -r .devDependencies.playwright testes/package.json)
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$V"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Todas as telas no modo demonstração (computador e celular)
        working-directory: testes
        run: npm run telas

      - name: Resultado
        if: always()
        working-directory: testes
        run: |
          if [ ! -f resultado.tap ]; then echo "::error title=Telas::O teste das telas não chegou a rodar."; exit 1; fi
          ok=$(grep -cE '^ *ok [0-9]+ ' resultado.tap || true)
          falhou=$(grep -cE '^ *not ok [0-9]+ ' resultado.tap || true)
          grep -E '^ *not ok [0-9]+ ' resultado.tap | sed -E 's/^ *not ok [0-9]+ - /::error title=Tela com problema::/' || true
          awk '/^ *not ok [0-9]+ /{f=1; n=$0; d=""; next} f && /^ *\.\.\.$/{print "::error title=Detalhe::" n " | " d; f=0; next} f{gsub(/^ +/,""); if (length(d) < 900) d=d " " $0}' resultado.tap || true
          echo "::notice title=Telas::$ok passaram, $falhou falharam"
          { echo "### Teste das telas"; echo "$ok passaram, $falhou falharam"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$falhou" = "0" ] && [ "$ok" -gt 0 ]
