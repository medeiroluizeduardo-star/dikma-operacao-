name: Publicar no Firebase

# Publica o site e as regras de segurança. Antes, roda os testes automáticos: se algum falhar, nada é publicado.
# Trava da main: só publica o que entrou por proposta (pull request) aceita. Um envio direto para a main
# (ou "Add files via upload" pelo site do GitHub) é barrado e o site continua como estava.
# Em emergência dá para publicar à mão pelo botão "Run workflow" (workflow_dispatch), que não passa pela trava.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  origem:
    name: Conferir se veio de proposta aceita
    runs-on: ubuntu-latest
    steps:
      - name: Conferir origem do envio
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "::notice::Publicação manual (Run workflow): trava de proposta não se aplica."
            exit 0
          fi
          # O GitHub às vezes leva alguns segundos para ligar o commit à proposta: tenta algumas vezes.
          for tentativa in 1 2 3 4; do
            QTD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length') || QTD=0
            if [ "${QTD:-0}" -gt 0 ]; then
              echo "Commit $GITHUB_SHA veio de proposta aceita. Pode publicar."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Envio direto para a main, sem proposta (pull request) aceita: o site NÃO foi publicado e continua como estava. Faça a mudança por proposta. Em emergência, use o botão Run workflow desta rotina."
          exit 1

  testes:
    needs: origem
    uses: ./.github/workflows/testes.yml

  publicar:
    needs: [origem, testes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Preparar credenciais
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta o secret FIREBASE_SERVICE_ACCOUNT. Veja o passo 6 do README."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"

      - name: Enviar dados de importação ao banco (não vão para o site)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install --no-audit --no-fund --prefix integracao/admin
          node integracao/admin/enviar-dados.mjs

      - name: Publicar site e regras de segurança
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive

      - name: Organizar o Efetivo por área (só na primeira vez)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node integracao/admin/migrar-areas.mjs

      - name: Endereço do sistema
        run: echo "::notice::Sistema publicado em https://$PROJECT_ID.web.app"
