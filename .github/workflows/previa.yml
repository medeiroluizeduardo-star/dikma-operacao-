name: Prévia da proposta

# Publica cada proposta (pull request) num endereço temporário do Firebase, que vale 7 dias.
# A prévia abre sempre no modo demonstração (dados de exemplo): não lê nem grava os dados reais.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: previa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  previa:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Site sem dados pessoais
        run: node ferramentas/conferir-site.mjs

      - name: Marcas dos arquivos (o celular baixa só o que mudou)
        run: node ferramentas/marcas-sw.mjs

      - name: Publicar a prévia
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          P=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
          # O Firebase tem limite de prévias: antes de criar, apaga as das propostas que já fecharam.
          abertas=" $(gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" --jq '.[].number' | tr '\n' ' ') "
          npx --yes firebase-tools@15 hosting:channel:list --project "$P" --json > "$RUNNER_TEMP/canais.json" || true
          for c in $(jq -r '.result.channels[]?.name // empty' "$RUNNER_TEMP/canais.json" | sed 's#.*/##' | grep -E '^pr[0-9]+$' || true); do
            n="${c#pr}"
            case "$abertas" in *" $n "*) ;; *) echo "Apagando a prévia antiga $c"; npx --yes firebase-tools@15 hosting:channel:delete "$c" --project "$P" --force || true ;; esac
          done
          npx --yes firebase-tools@15 hosting:channel:deploy "pr${{ github.event.pull_request.number }}" --expires 7d --project "$P" --json > "$RUNNER_TEMP/previa.json" || { cat "$RUNNER_TEMP/previa.json"; exit 1; }
          URL=$(jq -r '.result[]?.url // empty' "$RUNNER_TEMP/previa.json" | head -1)
          [ -n "$URL" ] || { cat "$RUNNER_TEMP/previa.json"; exit 1; }
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "::notice title=Prévia::$URL"

      - name: Avisar na proposta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          corpo="**Prévia desta proposta:** $URL

          Abre sempre no modo demonstração, com dados de exemplo. Vale 7 dias e é atualizada a cada mudança na proposta."
          ja=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq '[.[] | select(.body | startswith("**Prévia desta proposta:**"))][0].id // empty')
          if [ -n "$ja" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ja" -f body="$corpo" >/dev/null
          else gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$corpo" >/dev/null; fi
