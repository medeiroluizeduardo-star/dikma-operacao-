name: Apagar dados da Medição antiga

# Apaga o contratado da antiga Gestão › Medição do contrato (config/sistema.medicao do Pátio e da Bateria),
# aba removida no PR #132. Só manual (Run workflow). Rode antes a Cópia de segurança.
#   simular (padrão): só mostra o que existe.
#   gravar: guarda uma cópia do campo na coleção backups e apaga.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular (só mostra) ou gravar'
        type: choice
        options: [simular, gravar]
        default: simular

permissions:
  contents: read

concurrency:
  group: banco
  cancel-in-progress: false

jobs:
  apagar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apagar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APAGAR_MODO: ${{ inputs.modo }}
        run: |
          npm install --no-audit --no-fund --prefix integracao/admin
          node integracao/admin/apagar-medicao.mjs
